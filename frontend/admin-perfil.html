<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineReserva | Perfil d'administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- P-14 Pàgina perfil administrador -->
  <header class="capcalera capcalera--admin">
    <div class="capcalera__esquerra">
      <a class="logo" href="admin-perfil.html" aria-label="CineReserva, tauler d'administració">
        <img src="img/icon-clapperboard.svg" width="24" height="24" alt="">
        <span class="logo__text">CineReserva</span>
        <span class="etiqueta-admin">ADMIN</span>
      </a>
      <nav class="nav" aria-label="Navegació d'administració">
        <a href="admin-perfil.html" aria-current="page">Tauler</a>
        <a href="admin-cartellera.html">Pel·lícules</a>
        <a href="admin-sessions.html">Sessions</a>
        <a href="admin-sessions.html">Sales</a>
        <a href="admin-usuaris.html">Usuaris i reserves</a>
      </nav>
    </div>
    <div class="usuari">
      <a class="avatar" href="admin-perfil.html" aria-label="Perfil d'administrador"><img src="img/icon-user.svg" width="20" height="20" alt=""></a>
      <a class="usuari__nom" href="admin-perfil.html">Administrador</a>
      <a class="tanca-sessio" href="index.html"><img src="img/icon-log-out.svg" width="16" height="16" alt=""> Tanca sessió</a>
    </div>
  </header>

  <main class="contingut pila gap-40">
    <section class="perfil-cap">
      <div class="perfil-cap__foto"><img src="img/icon-image.svg" width="48" height="48" alt=""></div>
      <div class="pila gap-16">
        <h1 class="h3">Admin Principal</h1>
        <p class="text">Rol: Administrador del sistema<br>Últim accés: Avui 16:42</p>
        <label class="etiqueta-accent">
          Canvia la foto
          <input type="file" name="foto" accept="image/*" hidden>
        </label>
      </div>
    </section>

    <form class="pila gap-40" action="admin-perfil.html">
      <div class="fila" style="gap: 64px;">
        <label class="camp" style="width: 320px;">
          <span class="camp__etiqueta">Nom</span>
          <span class="camp__control"><input type="text" name="nom" placeholder="Admin Principal"></span>
        </label>
        <label class="camp" style="width: 320px;">
          <span class="camp__etiqueta">Correu electrònic</span>
          <span class="camp__control"><input type="email" name="correu" placeholder="admin@correu.cat"></span>
        </label>
      </div>

      <fieldset class="pila gap-16 sense-vora" style="width: 320px;">
        <legend class="subtitol">Canvia la contrasenya</legend>
        <label class="camp">
          <span class="sr-only">Contrasenya actual</span>
          <span class="camp__control"><input type="password" name="actual" placeholder="Contrasenya actual"></span>
        </label>
        <label class="camp">
          <span class="sr-only">Contrasenya nova</span>
          <span class="camp__control"><input type="password" name="nova" placeholder="Contrasenya nova"></span>
        </label>
      </fieldset>
    </form>
  </main>

  <footer class="peu">
    <span class="peu__copy">© 2026 CineReserva</span>
    <nav class="peu__enllacos" aria-label="Enllaços legals">
      <a href="#">Avís legal</a>
      <a href="#">Privacitat</a>
      <a href="#">Contacte</a>
    </nav>
  </footer>
</body>
</html>
