<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineReserva | Recupera la contrasenya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- P-06 Recuperació de contrasenya · escriptori -->
  <header class="capcalera">
    <div class="capcalera__esquerra">
      <a class="logo" href="index.html" aria-label="CineReserva, inici">
        <img src="img/icon-clapperboard.svg" width="24" height="24" alt="">
        <span class="logo__text">CineReserva</span>
      </a>
      <nav class="nav" aria-label="Navegació principal">
        <a href="index.html">Inici</a>
        <a href="cartellera.html">Cartellera</a>
      </nav>
    </div>
    <div class="capcalera__accions">
      <a class="btn btn--secundari" href="login.html">Inicia sessió</a>
      <a class="btn btn--primari" href="registre.html">Registra't</a>
    </div>
  </header>

  <main class="zona-centrada">
    <form class="targeta-auth" action="login.html">
      <h1 class="h1">Has oblidat la contrasenya?</h1>
      <p class="text">Escriu el teu correu i t'enviarem un enllaç per crear una contrasenya nova. L'enllaç caduca en 1 hora.</p>
      <label class="camp">
        <span class="camp__etiqueta">Correu electrònic</span>
        <span class="camp__control"><input type="email" name="correu" placeholder="exemple@correu.cat" required></span>
      </label>
      <button class="btn btn--primari btn--bloc" type="submit">Envia l'enllaç</button>
      <a class="enllac" href="login.html">Torna a iniciar sessió</a>
    </form>
  </main>

  <footer class="peu">
    <span class="peu__copy">© 2026 CineReserva</span>
    <nav class="peu__enllacos" aria-label="Enllaços legals">
      <a href="#">Avís legal</a>
      <a href="#">Privacitat</a>
      <a href="#">Contacte</a>
    </nav>
  </footer>
</body>
</html>
